<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双均线策略回测看板 — AI-Quant Lab</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="../js/indicators.js"></script>
<script src="backtest.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#2c3e50;padding:16px}
.container{max-width:1400px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:linear-gradient(135deg,#1a237e,#283593);color:#fff}
.header h1{font-size:17px;font-weight:600}
.header .badge{font-size:11px;opacity:.7;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:10px;margin-left:8px}
.header .info{font-size:12px;opacity:.8}
.toolbar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid #e0e0e0;flex-wrap:wrap;background:#fafafa}
.toolbar select{padding:5px 10px;border-radius:6px;border:1px solid #d0d0d0;font-size:13px;background:#fff;min-width:170px}
.param-group{display:flex;align-items:center;gap:8px;font-size:13px}
.param-group label{color:#78909c;font-size:12px}
.param-group input[type=number]{width:56px;padding:4px 6px;border-radius:4px;border:1px solid #d0d0d0;font-size:13px;text-align:center}
.btn-run{padding:6px 18px;border-radius:6px;border:1px solid #5c6bc0;background:#e8eaf6;font-size:13px;font-weight:500;color:#1a237e;cursor:pointer;transition:all .15s}
.btn-run:hover{background:#c5cae9}
/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:14px 20px;background:#fafafa;border-bottom:1px solid #eee}
.metric{border-radius:8px;padding:10px 14px;background:#fff;border:1px solid #eee}
.metric .lbl{font-size:11px;color:#90a4ae;margin-bottom:2px}
.metric .val{font-size:18px;font-weight:600}
.metric .sub{font-size:11px;color:#90a4ae;margin-top:2px}
.pos{color:#e53935!important}
.neg{color:#43a047!important}
/* Charts */
.chart-area{padding:16px}
.chart-box{border:1px solid #eee;border-radius:10px;margin-bottom:14px;overflow:hidden}
.chart-box .title{font-size:13px;font-weight:500;padding:10px 14px 0;color:#37474f}
.chart-box .chart{width:100%;height:340px}
.chart-box .chart-sm{width:100%;height:200px}
/* Trade table */
.table-wrap{overflow-x:auto;padding:0 14px 14px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f5f7fa;padding:8px 10px;text-align:right;font-weight:500;color:#546e7a;border-bottom:2px solid #e0e0e0;white-space:nowrap}
th:first-child{text-align:left}
td{padding:6px 10px;text-align:right;border-bottom:1px solid #f0f0f0;white-space:nowrap}
td:first-child{text-align:left;color:#78909c}
tr:hover{background:#fafafa}
.footer{display:flex;justify-content:space-between;padding:10px 20px;border-top:1px solid #eee;font-size:11px;color:#90a4ae}
@media(max-width:700px){.toolbar{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div><h1>双均线策略回测 <span class="badge">手续费万三·滑点万一</span></h1></div>
    <div class="info">初始资金 1,000,000</div>
  </div>

  <div class="toolbar">
    <select id="stockSelect"></select>
    <div class="param-group">
      <label>快线</label><input type="number" id="fastPeriod" value="5" min="2" max="200">
      <label>慢线</label><input type="number" id="slowPeriod" value="20" min="5" max="300">
    </div>
    <div class="param-group">
      <label>手续费</label><input type="text" value="万三" readonly style="width:46px;background:#f5f5f5;border:none;font-size:12px">
      <label>滑点</label><input type="text" value="万一" readonly style="width:46px;background:#f5f5f5;border:none;font-size:12px">
    </div>
    <button class="btn-run" id="runBtn">运行回测</button>
  </div>

  <!-- Metrics -->
  <div class="metrics" id="metricsBar">
    <div class="metric"><div class="lbl">累计收益率</div><div class="val" id="mReturn">--</div><div class="sub" id="mBuyHold">基准: --</div></div>
    <div class="metric"><div class="lbl">年化收益率</div><div class="val" id="mAnnual">--</div></div>
    <div class="metric"><div class="lbl">最大回撤</div><div class="val" id="mDrawdown">--</div></div>
    <div class="metric"><div class="lbl">交易次数</div><div class="val" id="mTrades">--</div></div>
    <div class="metric"><div class="lbl">胜率</div><div class="val" id="mWinRate">--</div></div>
    <div class="metric"><div class="lbl">Sharpe</div><div class="val" id="mSharpe">--</div></div>
    <div class="metric"><div class="lbl">总手续费</div><div class="val" id="mFee">--</div></div>
    <div class="metric"><div class="lbl">总滑点</div><div class="val" id="mSlippage">--</div></div>
  </div>

  <!-- Charts -->
  <div class="chart-area">
    <div class="chart-box">
      <div class="title">价格走势与交易信号</div>
      <div id="priceChart" class="chart"></div>
    </div>
    <div class="chart-box">
      <div class="title">累计收益曲线</div>
      <div id="equityChart" class="chart"></div>
    </div>
    <div class="chart-box">
      <div class="title">回测期间走势对比</div>
      <div id="compareChart" class="chart-sm"></div>
    </div>
  </div>

  <!-- Trade Table -->
  <div class="chart-box">
    <div class="title" style="padding-bottom:8px">交易记录</div>
    <div class="table-wrap" id="tradeTableWrap">
      <table><thead><tr><th>日期</th><th>方向</th><th>价格</th><th>数量(股)</th><th>手续费</th><th>盈亏</th><th>盈亏%</th><th>剩余现金</th></tr></thead><tbody id="tradeBody"></tbody></table>
    </div>
  </div>

  <div class="footer">
    <span>策略: 双均线交叉 | 买入: 金叉 (快线上穿慢线) | 卖出: 死叉 (快线下穿慢线)</span>
    <span>数据源: 预加载 | AI-Quant Lab</span>
  </div>

</div>

<script>
// ============================================================
// 股票数据 (复用 indicators.js 中的 STOCKS_DATA)
// ============================================================
const stockSelect = document.getElementById('stockSelect');
const fastPeriod = document.getElementById('fastPeriod');
const slowPeriod = document.getElementById('slowPeriod');
const runBtn = document.getElementById('runBtn');

// 初始化股票选择
Object.entries(STOCKS_DATA).forEach(([code, info]) => {
  const opt = document.createElement('option');
  opt.value = code;
  opt.textContent = `${info.name} (${code})`;
  stockSelect.appendChild(opt);
});
stockSelect.value = '000725.SZ';

// ============================================================
// ECharts 初始化
// ============================================================
const priceChart = echarts.init(document.getElementById('priceChart'));
const equityChart = echarts.init(document.getElementById('equityChart'));
const compareChart = echarts.init(document.getElementById('compareChart'));

// ============================================================
// 指标更新
// ============================================================
function setMetric(id, val, cls = '') {
  const el = document.getElementById(id);
  el.textContent = val;
  el.className = 'val ' + cls;
}

// ============================================================
// 运行回测
// ============================================================
function runBacktestAndRender() {
  const code = stockSelect.value;
  const data = STOCKS_DATA[code].data;
  const fast = parseInt(fastPeriod.value);
  const slow = parseInt(slowPeriod.value);

  if (fast >= slow) {
    alert('快线周期必须小于慢线周期');
    return;
  }
  if (!data || data.length < slow + 10) {
    alert('数据不足，请选择其他标的');
    return;
  }

  const result = runBacktest(data, fast, slow, 0.0003, 0.0001);
  if (!result) { alert('回测失败，数据不足'); return; }

  const s = result.summary;

  // Metrics
  const retCls = parseFloat(s.totalReturn) >= 0 ? 'pos' : 'neg';
  const bhCls = parseFloat(s.buyHoldReturn) >= 0 ? 'pos' : 'neg';
  setMetric('mReturn', (parseFloat(s.totalReturn) >= 0 ? '+' : '') + s.totalReturn + '%', retCls);
  document.getElementById('mBuyHold').textContent = '买入持有: ' + (parseFloat(s.buyHoldReturn) >= 0 ? '+' : '') + s.buyHoldReturn + '%';
  document.getElementById('mBuyHold').className = 'sub ' + bhCls;
  setMetric('mAnnual', (parseFloat(s.annualReturn) >= 0 ? '+' : '') + s.annualReturn + '%', parseFloat(s.annualReturn) >= 0 ? 'pos' : 'neg');
  setMetric('mDrawdown', '-' + s.maxDrawdown + '%', 'neg');
  setMetric('mTrades', s.tradeCount);
  setMetric('mWinRate', s.winRate + '%', parseFloat(s.winRate) >= 50 ? 'pos' : 'neg');
  setMetric('mSharpe', s.sharpe, parseFloat(s.sharpe) >= 1 ? 'pos' : 'neg');
  setMetric('mFee', '¥' + s.totalCommission.toLocaleString());
  setMetric('mSlippage', '¥' + s.totalSlippage.toLocaleString());

  const dates = data.map(d => d.date);
  const close = data.map(d => d.close);
  const { fastMA, slowMA } = result.extra;

  // 1. Price chart with signals
  const buySignals = result.trades.filter(t => t.type === 'buy').map(t => [t.date, t.price]);
  const sellSignals = result.trades.filter(t => t.type === 'sell' || t.type === 'close').map(t => [t.date, t.price]);

  priceChart.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
    legend: { data: ['收盘价', 'MA' + fast, 'MA' + slow, '买入', '卖出'], top: 0, textStyle: { fontSize: 11 } },
    grid: { left: '8%', right: '6%', top: '14%', bottom: '10%' },
    xAxis: { type: 'category', data: dates, axisLabel: { rotate: 30, fontSize: 10, interval: Math.max(Math.floor(dates.length / 15), 1) } },
    yAxis: { scale: true, splitLine: { lineStyle: { type: 'dashed' } } },
    dataZoom: [{ type: 'inside' }, { type: 'slider', height: 16, bottom: 0 }],
    series: [
      { name: '收盘价', type: 'line', data: close, showSymbol: false, lineStyle: { width: 1.2, color: '#1a237e' } },
      { name: 'MA' + fast, type: 'line', data: fastMA, showSymbol: false, lineStyle: { width: 1.5, color: '#e65100' } },
      { name: 'MA' + slow, type: 'line', data: slowMA, showSymbol: false, lineStyle: { width: 1.5, color: '#6a1b9a' } },
      { name: '买入', type: 'scatter', data: buySignals, symbol: 'pin', symbolSize: 28, itemStyle: { color: '#e53935' } },
      { name: '卖出', type: 'scatter', data: sellSignals, symbol: 'pin', symbolSize: 28, itemStyle: { color: '#43a047' } },
    ]
  });

  // 2. Equity curve
  const equityData = result.equity;
  equityChart.setOption({
    tooltip: { trigger: 'axis', valueFormatter: v => '¥' + Math.round(v).toLocaleString() },
    grid: { left: '8%', right: '6%', bottom: '10%' },
    xAxis: { type: 'category', data: dates, axisLabel: { rotate: 30, fontSize: 10, interval: Math.max(Math.floor(dates.length / 15), 1) } },
    yAxis: { type: 'value', axisLabel: { formatter: v => '¥' + (v / 10000).toFixed(0) + '万' }, splitLine: { lineStyle: { type: 'dashed' } } },
    dataZoom: [{ type: 'inside' }, { type: 'slider', height: 16, bottom: 0 }],
    series: [{
      name: '总资产', type: 'line', data: equityData, showSymbol: false,
      lineStyle: { width: 2, color: '#1a237e' },
      areaStyle: { color: 'rgba(26,35,126,0.08)' },
      markLine: { silent: true, data: [{ yAxis: 1000000, label: { formatter: '初始资金 ¥1,000,000', fontSize: 10 }, lineStyle: { color: '#90a4ae', type: 'dashed' } }] },
    }]
  });

  // 3. Comparison: strategy vs buy-hold
  const bhEquity = close.map(c => 1000000 * c / close[0]);
  compareChart.setOption({
    tooltip: { trigger: 'axis', valueFormatter: v => '¥' + Math.round(v).toLocaleString() },
    legend: { data: ['策略净值', '买入持有'], top: 0, textStyle: { fontSize: 11 } },
    grid: { left: '8%', right: '6%', bottom: '12%' },
    xAxis: { type: 'category', data: dates, axisLabel: { fontSize: 10, interval: Math.max(Math.floor(dates.length / 15), 1) } },
    yAxis: { type: 'value', axisLabel: { formatter: v => '¥' + (v / 10000).toFixed(0) + '万' }, splitLine: { lineStyle: { type: 'dashed' } } },
    series: [
      { name: '策略净值', type: 'line', data: equityData, showSymbol: false, lineStyle: { width: 2, color: '#1a237e' }, areaStyle: { color: 'rgba(26,35,126,0.06)' } },
      { name: '买入持有', type: 'line', data: bhEquity, showSymbol: false, lineStyle: { width: 1.5, color: '#90a4ae', type: 'dashed' } },
    ]
  });

  // 4. Trade table
  const tbody = document.getElementById('tradeBody');
  tbody.innerHTML = '';
  result.trades.forEach(t => {
    const tr = document.createElement('tr');
    const typeLabel = t.type === 'buy' ? '买入' : (t.type === 'sell' ? '卖出' : '平仓');
    const typeColor = t.type === 'buy' ? '#e53935' : '#43a047';
    tr.innerHTML = `
      <td>${t.date}</td>
      <td style="color:${typeColor};font-weight:500">${typeLabel}</td>
      <td>${t.price.toFixed(2)}</td>
      <td>${t.shares ? t.shares.toLocaleString() : '-'}</td>
      <td>${t.fee ? '¥' + t.fee.toFixed(2) : '-'}</td>
      <td style="color:${t.profit && t.profit > 0 ? '#e53935' : '#43a047'}">${t.profit ? (t.profit >= 0 ? '+' : '') + '¥' + t.profit.toFixed(2) : '-'}</td>
      <td style="color:${t.profitPct && t.profitPct > 0 ? '#e53935' : '#43a047'}">${t.profitPct ? (t.profitPct >= 0 ? '+' : '') + t.profitPct.toFixed(2) + '%' : '-'}</td>
      <td>¥${t.cash ? Math.round(t.cash).toLocaleString() : '-'}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ============================================================
// 事件
// ============================================================
runBtn.addEventListener('click', runBacktestAndRender);
stockSelect.addEventListener('change', runBacktestAndRender);
fastPeriod.addEventListener('change', runBacktestAndRender);
slowPeriod.addEventListener('change', runBacktestAndRender);

window.addEventListener('resize', () => {
  priceChart.resize();
  equityChart.resize();
  compareChart.resize();
});

// ============================================================
// 启动
// ============================================================
stockSelect.value = '000725.SZ';
runBacktestAndRender();
</script>
</body>
</html>
