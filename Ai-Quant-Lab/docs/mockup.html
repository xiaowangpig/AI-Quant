<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>技术指标计算工作台 — 设计参考</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f6fa;color:#2c3e50;padding:24px}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-radius:12px 12px 0 0;border-bottom:1px solid #e0e0e0}
.toolbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid #e0e0e0;flex-wrap:wrap}
.main{display:flex;min-height:500px;background:#fff}
.sidebar{width:300px;flex-shrink:0;border-right:1px solid #e0e0e0;padding:12px;background:#fafafa}
.chart-area{flex:1;padding:16px;display:flex;flex-direction:column}
.footer-bar{display:flex;justify-content:space-between;padding:8px 16px;background:#fff;border-top:1px solid #e0e0e0;border-radius:0 0 12px 12px;font-size:12px;color:#90a4ae}
select{padding:6px 10px;border-radius:6px;border:1px solid #e0e0e0;font-size:13px;background:#fff}
.btn{padding:4px 12px;border-radius:4px;border:1px solid #e0e0e0;background:#fff;font-size:12px;cursor:pointer}
.btn.active{background:#e8eaf6;border-color:#5c6bc0;font-weight:500}
input[type=date]{padding:4px 8px;border-radius:4px;border:1px solid #e0e0e0;font-size:12px}
.param-card{border:1px solid #e0e0e0;border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff}
.param-card h3{font-size:13px;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.param-card .dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.view-tabs{display:flex;gap:4px;margin-bottom:8px}
.view-tabs button{flex:1;padding:5px 0;font-size:11px;border:1px solid #e0e0e0;border-radius:4px;background:#fff;cursor:pointer}
.view-tabs button.active{background:#e8eaf6;border-color:#5c6bc0;font-weight:500}
.chart-box{flex:1;border:1px solid #e0e0e0;border-radius:12px;background:#fafafa;position:relative;min-height:320px;display:flex;align-items:center;justify-content:center;color:#b0bec5;font-size:14px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.metric{background:#f5f5f5;border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.metric .lbl{font-size:11px;color:#90a4ae}
.metric .val{font-size:13px;font-weight:500}
.range-row{display:flex;align-items:center;gap:6px}
.range-row input[type=range]{flex:1;height:4px}
.range-row .val{font-size:12px;min-width:24px;text-align:right;font-weight:500}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid-2 label,.grid-3 label{font-size:11px;color:#90a4ae;display:block;margin-bottom:2px}
.grid-2 input,.grid-3 input{width:100%;padding:3px 4px;border-radius:4px;border:1px solid #e0e0e0;font-size:12px}
.grid-2 select,.grid-3 select{width:100%;padding:3px 4px;border-radius:4px;border:1px solid #e0e0e0;font-size:12px}
.action-row{display:flex;gap:8px;margin-top:8px}
.action-row button{flex:1;padding:6px 0;font-size:12px;border-radius:6px;cursor:pointer}
.btn-primary{background:#e8eaf6;border:1px solid #5c6bc0;font-weight:500}
.btn-secondary{background:#fff;border:1px solid #e0e0e0}
.label-row{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;font-size:11px;color:#90a4ae}
.label-row label{display:flex;align-items:center;gap:4px;cursor:pointer}
</style></head><body>

<div style="max-width:1200px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;color:#2c3e50">

<!-- Header -->
<div class="top-bar">
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-size:15px;font-weight:500">技术指标计算工作台</span>
    <span style="font-size:11px;color:#90a4ae;background:#f5f5f5;padding:2px 8px;border-radius:10px">交互式 Mockup</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#90a4ae">
    <span style="width:6px;height:6px;border-radius:50%;background:#43a047;display:inline-block"></span>
    数据已加载: 7 只股票
  </div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <select style="min-width:160px">
    <option>中芯国际 (688981.SH)</option>
    <option selected>京东方A (000725.SZ)</option>
    <option>比亚迪 (002594.SZ)</option>
    <option>长江电力 (600900.SH)</option>
    <option>贵州茅台 (600519.SH)</option>
    <option>腾讯控股 (00700.HK)</option>
    <option>中芯国际 (00981.HK)</option>
  </select>
  <div style="display:flex;gap:4px;font-size:12px">
    <button class="btn">近1月</button>
    <button class="btn">近3月</button>
    <button class="btn active">近1年</button>
    <button class="btn">全部</button>
  </div>
  <input type="date" value="2025-07-06"> <span style="font-size:12px;color:#90a4ae">~</span> <input type="date" value="2026-07-06">
</div>

<!-- Main -->
<div class="main">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="view-tabs">
      <button>K线</button>
      <button class="active">RSI</button>
      <button>MACD</button>
      <button>布林</button>
      <button>ATR</button>
    </div>

    <!-- RSI -->
    <div class="param-card">
      <h3><span class="dot" style="background:#6a1b9a"></span>RSI</h3>
      <div class="grid-2">
        <div><label>周期</label><div class="range-row"><input type="range" min="2" max="50" value="14"><span class="val">14</span></div></div>
        <div><label>超买</label><div class="range-row"><input type="range" min="50" max="95" value="70" style="accent-color:#e53935"><span class="val">70</span></div></div>
      </div>
    </div>

    <!-- MACD -->
    <div class="param-card">
      <h3><span class="dot" style="background:#1565c0"></span>MACD</h3>
      <div class="grid-3">
        <div><label>快线</label><input type="number" value="12"></div>
        <div><label>慢线</label><input type="number" value="26"></div>
        <div><label>信号</label><input type="number" value="9"></div>
      </div>
    </div>

    <!-- BB -->
    <div class="param-card">
      <h3><span class="dot" style="background:#e65100"></span>布林带</h3>
      <div class="grid-3">
        <div><label>周期</label><input type="number" value="20"></div>
        <div><label>K (σ)</label><input type="number" value="2.0" step="0.1"></div>
        <div><label>均线</label><select><option>SMA</option><option>EMA</option></select></div>
      </div>
    </div>

    <!-- ATR -->
    <div class="param-card">
      <h3><span class="dot" style="background:#ff6f00"></span>ATR</h3>
      <div class="grid-2">
        <div><label>周期</label><div class="range-row"><input type="range" min="2" max="50" value="14"><span class="val">14</span></div></div>
        <div><label>平滑</label><select><option>SMA</option><option>EMA</option><option>WMA</option></select></div>
      </div>
    </div>

    <div class="action-row">
      <button class="btn-primary">重绘</button>
      <button class="btn-secondary">重置参数</button>
    </div>
  </div>

  <!-- Chart -->
  <div class="chart-area">
    <div class="chart-box">
      <svg viewBox="0 0 600 280" width="100%" height="100%" style="position:absolute;top:0;left:0">
        <line x1="0" y1="30" x2="600" y2="30" stroke="#e0e0e0" stroke-width="0.5"/>
        <line x1="0" y1="75" x2="600" y2="75" stroke="#e0e0e0" stroke-width="0.5"/>
        <line x1="0" y1="120" x2="600" y2="120" stroke="#e0e0e0" stroke-width="0.5"/>
        <line x1="0" y1="165" x2="600" y2="165" stroke="#e0e0e0" stroke-width="0.5"/>
        <line x1="0" y1="210" x2="600" y2="210" stroke="#e0e0e0" stroke-width="0.5"/>
        <line x1="0" y1="255" x2="600" y2="255" stroke="#e0e0e0" stroke-width="0.5"/>
        <text x="10" y="24" font-size="10" fill="#90a4ae">160</text>
        <text x="10" y="69" font-size="10" fill="#90a4ae">140</text>
        <text x="10" y="114" font-size="10" fill="#90a4ae">120</text>
        <text x="10" y="159" font-size="10" fill="#90a4ae">100</text>
        <text x="10" y="204" font-size="10" fill="#90a4ae">80</text>
        <text x="10" y="249" font-size="10" fill="#90a4ae">60</text>
        <polyline points="0,240 30,228 60,235 90,205 120,218 150,195 180,172 210,150 240,138 270,118 300,95 330,78 360,55 390,72 420,85 450,68 480,92 510,78 540,102 570,95 600,112" fill="none" stroke="#1a237e" stroke-width="1.5"/>
        <polyline points="0,268 30,252 60,258 90,242 120,248 150,236 180,226 210,230 240,220 270,214 300,226 330,236 360,242 390,248 420,230 450,248 480,236 510,242 540,252 570,248 600,258" fill="none" stroke="#6a1b9a" stroke-width="1.5"/>
        <line x1="0" y1="235" x2="600" y2="235" stroke="#e53935" stroke-width="0.5" stroke-dasharray="4,3"/>
        <text x="585" y="233" font-size="9" fill="#e53935">70</text>
        <line x1="0" y1="235" x2="600" y2="235" stroke="#e53935" stroke-width="0.5" stroke-dasharray="4,3"/>
        <line x1="0" y1="280" x2="600" y2="280" stroke="#43a047" stroke-width="0.5" stroke-dasharray="4,3"/>
        <text x="585" y="278" font-size="9" fill="#43a047">30</text>
        <text x="300" y="16" text-anchor="middle" font-size="11" fill="#78909c" font-weight="500">京东方A (000725.SZ) — RSI(14) | 数据区间: 2025-07 ~ 2026-07</text>
      </svg>
      <div style="position:absolute;top:8px;right:8px;background:#fff;border:1px solid #e0e0e0;border-radius:4px;padding:4px 8px;font-size:10px;color:#90a4ae">ECharts 交互图表</div>
    </div>

    <div class="metrics">
      <div class="metric"><span class="lbl">RSI(14)</span><span class="val" style="color:#6a1b9a">58.2</span></div>
      <div class="metric"><span class="lbl">MACD</span><span class="val" style="color:#1565c0">+2.14</span></div>
      <div class="metric"><span class="lbl">%B</span><span class="val" style="color:#e65100">0.72</span></div>
      <div class="metric"><span class="lbl">ATR(14)</span><span class="val" style="color:#ff6f00">3.45</span></div>
    </div>

    <div class="label-row">
      <label><input type="checkbox" checked> 显示均线 (MA5/MA20)</label>
      <label><input type="checkbox"> 显示成交量</label>
    </div>
  </div>
</div>

<div class="footer-bar">
  <span>数据源: Tushare Pro | 计算引擎: 浏览器端 JavaScript</span>
  <span>指标值随参数变化实时更新</span>
</div>
</div>

<div style="text-align:center;padding:16px 0;font-size:12px;color:#90a4ae;max-width:1200px;margin:0 auto">
  完整版开发计划见 <a href="docs/SPEC_dashboard.md" style="color:#5c6bc0">SPEC_dashboard.md</a>
</div>

</body></html>
