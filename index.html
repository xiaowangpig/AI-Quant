<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Quant 股票仪表盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6fa;
    color: #2c3e50;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  .container { max-width: 800px; width: 100%; }
  .header {
    background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
    color: white;
    border-radius: 12px;
    padding: 32px;
    margin-bottom: 28px;
    box-shadow: 0 4px 20px rgba(26,35,126,0.2);
    text-align: center;
  }
  .header h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
  .header p { font-size: 14px; opacity: 0.75; }
  .cards { display: grid; gap: 16px; }
  .card {
    background: white;
    border-radius: 12px;
    padding: 24px 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s;
    border: 1px solid transparent;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.10);
    border-color: #5c6bc0;
  }
  .card .info { flex: 1; }
  .card .code { font-size: 12px; color: #90a4ae; margin-bottom: 4px; }
  .card .name { font-size: 18px; font-weight: 600; }
  .card .desc { font-size: 13px; color: #78909c; margin-top: 6px; }
  .card .arrow { font-size: 24px; color: #c5cae9; }
  .footer {
    text-align: center;
    font-size: 12px;
    color: #90a4ae;
    margin-top: 28px;
  }
  .footer a { color: #5c6bc0; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📈 AI-Quant 股票仪表盘</h1>
    <p>基于 Tushare Pro 数据 + ECharts 可视化的 K线图面板</p>
  </div>
  <div class="cards">
    <a class="card" href="boe/index.html">
      <div class="info">
        <div class="code">000725.SZ</div>
        <div class="name">京东方A</div>
        <div class="desc">面板显示龙头 · 近1年日线数据 · K线图 + 成交量</div>
      </div>
      <div class="arrow">→</div>
    </a>
    <a class="card" href="smic/index.html">
      <div class="info">
        <div class="code">688981.SH</div>
        <div class="name">中芯国际</div>
        <div class="desc">芯片制造龙头 · 近1年日线数据 · K线图 + 成交量</div>
      </div>
      <div class="arrow">→</div>
    </a>
    <a class="card" href="Ai-Quant-Lab/index.html">
      <div class="info">
        <div class="code">LAB</div>
        <div class="name">AI-Quant Lab</div>
        <div class="desc">技术指标交互计算工作台 · RSI / MACD / 布林带 / ATR</div>
      </div>
      <div class="arrow">→</div>
    </a>
  </div>
  <div class="footer">
    数据来源：<a href="https://tushare.pro" target="_blank">Tushare Pro</a> | 仅作展示，不构成投资建议
  </div>
</div>
</body>
</html>
